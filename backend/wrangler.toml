name = "convertmate-backend"
main = "index.js"
compatibility_date = "2024-10-31" # Atualizado para a data de hoje para garantir compatibilidade com recursos mais recentes

[dev]
port = 8787

[[r2_buckets]]
binding = "R2_BUCKET" # Variável de ambiente para acesso ao R2
bucket_name = "convertmate-files" # Mantendo o nome do bucket original

# Adicionando a configuração para Pages Functions (se o worker for usado em Pages)
[site]
bucket = "./frontend" # Assumindo que o frontend será servido via Pages
