name = "convertmate-backend"
main = "index.js"
compatibility_date = "2025-10-31" # Atualizado para a data de hoje para garantir compatibilidade com recursos mais recentes
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787

[[r2_buckets]]
binding = "R2_BUCKET" # Variável de ambiente para acesso ao R2
bucket_name = "convertmate-files" # Mantendo o nome do bucket original

# Configuração dos assets estáticos do frontend
[assets]
directory = "../frontend" # Diretório que contém os arquivos HTML/CSS/JS
# binding = "ASSETS" # Binding implícito; definido apenas para clareza se necessário

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1